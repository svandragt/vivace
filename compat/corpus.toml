# Pinned corpus for the release compatibility sweep (compat/run.sh).
#
# `make compat-refresh` rewrites each `commit` to the repo's current
# default-branch head (`git ls-remote <repo> HEAD`), so a refresh always
# tests the latest tree; commit them again to make a new run reproducible.
#
# drupal/recommended-project has no installable git checkout (its docroot
# is assembled by Composer, not committed), so it's built with
# `composer create-project --no-install` from a pinned released `version`
# instead of `repo`/`commit`.

