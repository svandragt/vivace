[licenses]
# Each entry is the license actually chosen by `cargo deny list` for at least
# one crate in the tree (dual-licensed crates resolve to their simplest match,
# so unused alternatives like BSD-2-Clause or MPL-2.0 are left out).
allow = [
    "MIT",                            # most of the tree
    "Apache-2.0",                     # e.g. anyhow, reqwest
    "Apache-2.0 WITH LLVM-exception", # linux-raw-sys, rustix, wasi
    "BSD-3-Clause",                   # aws-lc-sys, subtle
    "ISC",                            # aws-lc-rs, rustls and friends
    "Unicode-3.0",                    # icu_* crates
    "Zlib",                           # miniz_oxide, zlib-rs
    "CDLA-Permissive-2.0",            # webpki-root-certs
    "Unlicense",                      # aho-corasick, memchr, walkdir
    "CC0-1.0",                        # dunce
    "BSL-1.0",                        # xxhash-rust (drupal scaffold version hash)
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "allow"
