[package]
name = "vivace-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
anyhow = "1"
arbitrary = { version = "1", features = ["derive"] }
fs-err = "3"
futures = "0.3"
reqwest = { version = "0.13.4", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"

[dependencies.vivace]
path = ".."

[[bin]]
name = "classmap_find_classes"
path = "fuzz_targets/classmap_find_classes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_extract_archive"
path = "fuzz_targets/store_extract_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lock_content_hash"
path = "fuzz_targets/lock_content_hash.rs"
test = false
doc = false
bench = false

[[bin]]
name = "repository_expand_minified"
path = "fuzz_targets/repository_expand_minified.rs"
test = false
doc = false
bench = false

[[bin]]
name = "semver_parse_constraint"
path = "fuzz_targets/semver_parse_constraint.rs"
test = false
doc = false
bench = false
