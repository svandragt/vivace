name: Bug
description: viv did something wrong or crashed
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact viv command, with flags.
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: dropdown
    id: composer
    attributes:
      label: Does Composer produce the same vendor/ for this project?
      options:
        - "Yes, Composer's output is the same"
        - "No, Composer's output differs"
        - Not checked
    validations:
      required: true
  - type: textarea
    id: diagnose
    attributes:
      label: viv diagnose output
      description: Paste the output of `viv diagnose`. It names auth sources but never prints secrets.
      render: text
    validations:
      required: true
