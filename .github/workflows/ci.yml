name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- cargo fmt --check
      - run: devbox run -- cargo clippy --all-targets -- -D warnings
      - run: devbox run -- cargo nextest run
        env:
          VIVACE_TEST_NETWORK: "1"
      - run: devbox run -- cargo deny check
      - run: devbox run -- cargo machete
      - run: devbox run -- env RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items

  # macOS is a supported platform; this job blocks like the Linux one.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- cargo fmt --check
      - run: devbox run -- cargo clippy --all-targets -- -D warnings
      - run: devbox run -- cargo nextest run
        env:
          VIVACE_TEST_NETWORK: "1"
      - run: devbox run -- cargo deny check
      - run: devbox run -- cargo machete
      - run: devbox run -- env RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items

  # Report only, no threshold (#45): surfaces which parts of the solver port
  # and lock writer are untested, not a number to gate on.
  coverage:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: mkdir -p target/coverage
      - run: devbox run -- cargo llvm-cov nextest --no-fail-fast --lcov --output-path target/coverage/lcov.info
        env:
          VIVACE_TEST_NETWORK: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
      - run: |
          {
            echo '# Coverage (per file, no threshold)'
            echo '```'
            devbox run -- cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  bench:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- cargo build --release
      - run: devbox run -- bench/run.sh tests/fixtures/monolog composer viv
        env:
          BENCH_RUNS: 5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench/results/*.json
      # Fails the job on a warm or no-op regression past tolerance; skips with a
      # notice if bench/results/baseline.json has no entry yet for this project.
      - run: python3 bench/compare.py bench/results/viv.json --baseline bench/results/baseline.json
      # Runners differ from a maintainer's machine, so the baseline can't come
      # from a local run: this candidate is uploaded for a maintainer to
      # download and commit as bench/results/baseline.json (see bench/results/README.md).
      - run: |
          cp bench/results/baseline.json /tmp/baseline-candidate.json
          python3 bench/compare.py bench/results/viv.json --baseline /tmp/baseline-candidate.json --write-baseline
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: baseline-candidate
          path: /tmp/baseline-candidate.json
