name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A run with no code change, for measuring the workflow itself (#195).
  workflow_dispatch:

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 54 tests fetch real dists from GitHub and Packagist. Unauthenticated
# zipball downloads from Linux runners returned 504 on three runs in a row
# while the same URLs worked elsewhere (#195); the workflow token, read by
# both viv and Composer through COMPOSER_AUTH, makes those requests
# authenticated. A retry covers a single blip; an outage still fails.
env:
  NEXTEST_RETRIES: 2
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- cargo fmt --check
      - run: devbox run -- cargo clippy --all-targets -- -D warnings
      # Adapter tests run in their own `plugins` job (below); excluded here so
      # a native-adapter regression fails fast without waiting on the rest of
      # the suite.
      - run: devbox run -- cargo nextest run -E 'not (test(plugin) | binary(plugins_*))'
        env:
          VIVACE_TEST_NETWORK: "1"
      - run: devbox run -- cargo deny check
      - run: devbox run -- cargo machete
      - run: devbox run -- env RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items

  # #127: every native adapter's own unit and e2e tests, split from `check`'s
  # nextest run so an adapter regression is visible on its own, not buried in
  # the full suite's output.
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: plugins
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- cargo nextest run -E 'test(plugin) | binary(plugins_*)'
        env:
          VIVACE_TEST_NETWORK: "1"

  # #263: the composite action installs the latest release, and a real
  # install runs through the shim in strict mode, so a silent fallback to
  # Composer fails the job instead of passing quietly.
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./action
      - run: composer install --no-dev
        working-directory: tests/fixtures/monolog
        env:
          VIV_SHIM_STRICT: "1"
      - run: test -f tests/fixtures/monolog/vendor/autoload.php

  # macOS is a supported platform; this job blocks like the Linux one. It
  # runs alongside the Linux gate: serialising them put it on the critical
  # path and cost more wall time than the occasional fmt slip saved (#195).
  # No devbox here: its macOS install took 186 s of a 6 min job. The runner's
  # own rustup plus setup-php gives the tests the same `php` and `composer`
  # on PATH in seconds. Lints that don't depend on the OS stay Linux-only.
  check-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          tools: composer:2
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: nextest
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run
        env:
          VIVACE_TEST_NETWORK: "1"

  # Report only, no threshold (#45): surfaces which parts of the solver port
  # and lock writer are untested, not a number to gate on. Not chained
  # behind `check`: the chain was a 5 min critical path for a report (#195).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: mkdir -p target/coverage
      - run: devbox run -- cargo llvm-cov nextest --no-fail-fast --lcov --output-path target/coverage/lcov.info
        env:
          VIVACE_TEST_NETWORK: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
      - run: |
          {
            echo '# Coverage (per file, no threshold)'
            echo '```'
            devbox run -- cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # One job per project so the two hyperfine runs overlap instead of
  # queueing (#195). Each job uploads its own results and baseline candidate;
  # a candidate carries the committed baseline's other project untouched.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: monolog
            dir: tests/fixtures/monolog
            out: bench/results
            compare_args: ""
          # bench/laravel (101 packages) is a second, larger project so a
          # regression that only shows with real package counts doesn't hide
          # behind monolog's tiny warm/noop times (#164).
          - project: laravel
            dir: bench/laravel
            out: bench/results/laravel
            compare_args: --project laravel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: bench
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.project == 'monolog' }}
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- cargo build --release
      - run: devbox run -- bench/run.sh ${{ matrix.dir }} composer viv
        env:
          BENCH_RUNS: 5
          BENCH_OUT: ${{ matrix.out }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-${{ matrix.project }}
          path: bench/results/**/*.json
      # Fails the job on a warm, no-op or update-offline (#165) regression past
      # tolerance on viv/composer's ratio (runner-independent, see
      # bench/compare.py); skips with a notice if bench/results/baseline.json
      # has no entry yet for this project. update-warm stays informational (#159).
      - run: python3 bench/compare.py $O/viv.json $O/viv-update.json $O/viv-update-offline.json $O/composer.json $O/composer-update.json ${{ matrix.compare_args }} --baseline bench/results/baseline.json
        env:
          O: ${{ matrix.out }}
      # Runners differ from a maintainer's machine, so the baseline can't come
      # from a local run: this candidate is uploaded for a maintainer to
      # download and commit as bench/results/baseline.json (see bench/results/README.md).
      - run: |
          cp bench/results/baseline.json /tmp/baseline-candidate.json
          python3 bench/compare.py $O/viv.json $O/viv-update.json $O/viv-update-offline.json $O/composer.json $O/composer-update.json ${{ matrix.compare_args }} --baseline /tmp/baseline-candidate.json --write-baseline
        env:
          O: ${{ matrix.out }}
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: baseline-candidate-${{ matrix.project }}
          path: /tmp/baseline-candidate.json
      # #183: the noise gate fails often enough that continue-on-error hides
      # it from the run's status; this keeps a red bench visible instead of
      # silently green.
      - if: failure()
        run: "echo '**bench gate failed** (${{ matrix.project }}): noise gate, see #183 (bench: the Laravel no-op cell is noisier than the 5 ms slack)' >> \"$GITHUB_STEP_SUMMARY\""
