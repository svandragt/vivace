name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- cargo fmt --check
      - run: devbox run -- cargo clippy --all-targets -- -D warnings
      # Adapter tests run in their own `plugins` job (below); excluded here so
      # a native-adapter regression fails fast without waiting on the rest of
      # the suite.
      - run: devbox run -- cargo nextest run -E 'not (test(plugin) | binary(plugins_*))'
        env:
          VIVACE_TEST_NETWORK: "1"
      - run: devbox run -- cargo deny check
      - run: devbox run -- cargo machete
      - run: devbox run -- env RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items

  # #127: every native adapter's own unit and e2e tests, split from `check`'s
  # nextest run so an adapter regression is visible on its own, not buried in
  # the full suite's output.
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: plugins
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- cargo nextest run -E 'test(plugin) | binary(plugins_*)'
        env:
          VIVACE_TEST_NETWORK: "1"

  # macOS is a supported platform; this job blocks like the Linux one. It
  # waits for the Linux gate so a fmt or clippy slip is paid once, on the
  # cheaper runner.
  check-macos:
    needs: check
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- cargo fmt --check
      - run: devbox run -- cargo clippy --all-targets -- -D warnings
      - run: devbox run -- cargo nextest run
        env:
          VIVACE_TEST_NETWORK: "1"
      - run: devbox run -- cargo deny check
      - run: devbox run -- cargo machete
      - run: devbox run -- env RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items

  # Report only, no threshold (#45): surfaces which parts of the solver port
  # and lock writer are untested, not a number to gate on.
  coverage:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: mkdir -p target/coverage
      - run: devbox run -- cargo llvm-cov nextest --no-fail-fast --lcov --output-path target/coverage/lcov.info
        env:
          VIVACE_TEST_NETWORK: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
      - run: |
          {
            echo '# Coverage (per file, no threshold)'
            echo '```'
            devbox run -- cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  bench:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- cargo build --release
      - run: devbox run -- bench/run.sh tests/fixtures/monolog composer viv
        env:
          BENCH_RUNS: 5
      # bench/laravel (101 packages) is a second, larger project so a
      # regression that only shows with real package counts doesn't hide
      # behind monolog's tiny warm/noop times (#164). BENCH_OUT keeps its
      # results out of bench/results/viv.json, which monolog just wrote.
      - run: devbox run -- bench/run.sh bench/laravel composer viv
        env:
          BENCH_RUNS: 5
          BENCH_OUT: bench/results/laravel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench/results/**/*.json
      # Fails the job on a warm, no-op or update-offline (#165) regression past
      # tolerance on viv/composer's ratio (runner-independent, see
      # bench/compare.py); skips with a notice if bench/results/baseline.json
      # has no entry yet for this project. update-warm stays informational (#159).
      - run: python3 bench/compare.py bench/results/viv.json bench/results/viv-update.json bench/results/viv-update-offline.json bench/results/composer.json bench/results/composer-update.json --baseline bench/results/baseline.json
      - run: python3 bench/compare.py bench/results/laravel/viv.json bench/results/laravel/viv-update.json bench/results/laravel/viv-update-offline.json bench/results/laravel/composer.json bench/results/laravel/composer-update.json --project laravel --baseline bench/results/baseline.json
      # Runners differ from a maintainer's machine, so the baseline can't come
      # from a local run: this candidate is uploaded for a maintainer to
      # download and commit as bench/results/baseline.json (see bench/results/README.md).
      - run: |
          cp bench/results/baseline.json /tmp/baseline-candidate.json
          python3 bench/compare.py bench/results/viv.json bench/results/viv-update.json bench/results/viv-update-offline.json bench/results/composer.json bench/results/composer-update.json --baseline /tmp/baseline-candidate.json --write-baseline
          python3 bench/compare.py bench/results/laravel/viv.json bench/results/laravel/viv-update.json bench/results/laravel/viv-update-offline.json bench/results/laravel/composer.json bench/results/laravel/composer-update.json --project laravel --baseline /tmp/baseline-candidate.json --write-baseline
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: baseline-candidate
          path: /tmp/baseline-candidate.json
      # #183: the noise gate fails often enough that continue-on-error hides
      # it from the run's status; this keeps a red bench visible instead of
      # silently green.
      - if: failure()
        run: "echo '**bench gate failed**: noise gate, see #183 (bench: the Laravel no-op cell is noisier than the 5 ms slack)' >> \"$GITHUB_STEP_SUMMARY\""
