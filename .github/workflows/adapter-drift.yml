name: Adapter drift

# #127 part 3: every native adapter (`src/plugins/*.rs`) ports one upstream
# Composer plugin at a pinned version (`Adapter::upstream_version`). This
# checks that pin against Packagist weekly and files (or clears) one issue
# naming every adapter that has fallen behind, and the fixture that would
# need re-verifying if it were ported forward
# (`docs/plugin-strategy.md#upstream-drift`).
#
# #245: it also checks each adapter's Packagist licence against the
# "Ported plugins" table in `NOTICE.md`. Unlike a version lag, a licence
# mismatch — upstream relicensed, or a new port landed with no NOTICE.md
# row at all — is a potential distribution problem, not a tracked backlog
# item, so it fails the job rather than filing an issue.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  ISSUE_TITLE: "Adapter drift: native adapters behind upstream"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: devbox run -- cargo build --release
      - name: Compare every adapter's ported version and licence with Packagist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Newest non-dev, non-prerelease version from a p2 metadata
          # response. Some packages mix "v"-prefixed and bare tags across
          # their history (php-http/discovery is one), which sorts wrongly
          # under a plain `sort -V` (a leading letter sorts after a leading
          # digit) — sorted on the "v"-stripped copy instead, original
          # spelling kept for the printed result.
          latest_stable_version() {
            jq -r --arg name "$1" '.packages[$name][]?.version' \
              | grep -vE '^dev-' \
              | grep -viE -- '-(alpha|beta|rc|patch)[0-9]*$' \
              | sed -E 's/^(v?)(.*)/\2\t\1\2/' \
              | sort -t "$(printf '\t')" -k1,1V \
              | tail -1 | cut -f2
          }

          # True when $2 (latest) is newer than $1 (recorded), ignoring an
          # optional leading "v" either side may or may not have.
          is_behind() {
            local recorded="${1#v}" latest="${2#v}"
            [ -n "$latest" ] \
              && [ "$(printf '%s\n%s\n' "$recorded" "$latest" | sort -V | tail -1)" != "$recorded" ]
          }

          # The licence NOTICE.md's "Ported plugins" table records for a
          # Packagist name, with the `**GPL-2.0-or-later**` bold markers the
          # three GPL rows use stripped. Empty (and a non-zero exit) when the
          # name has no row at all — the case a new port would land in if
          # nobody added one.
          notice_licence() {
            awk -F'|' -v name="$1" '
              /^\| \[/ {
                link=$2
                gsub(/^[ \t]*\[/, "", link); sub(/\]\(.*/, "", link)
                if (link == name) {
                  lic=$3
                  gsub(/^[ \t]*\*{0,2}/, "", lic); gsub(/\*{0,2}[ \t]*$/, "", lic)
                  print lic
                  found=1
                }
              }
              END { if (!found) exit 1 }
            ' NOTICE.md
          }

          table="| Plugin | Ported version | Latest | Fixture |\n|---|---|---|---|\n"
          behind=0
          licence_table="| Plugin | NOTICE.md licence | Packagist licence |\n|---|---|---|\n"
          licence_problem=0
          while IFS=$'\t' read -r name version fixture; do
            [ -n "$name" ] || continue
            json=$(curl -sf "https://repo.packagist.org/p2/${name}.json") \
              || { echo "::warning::${name}: Packagist metadata fetch failed, skipping" >&2; continue; }
            latest=$(printf '%s' "$json" | latest_stable_version "$name")
            if is_behind "$version" "$latest"; then
              behind=1
              table="${table}| ${name} | ${version} | ${latest} | ${fixture} |\n"
            fi

            if recorded=$(notice_licence "$name"); then
              # The array's own first entry, not `$latest`: some packages
              # (drupal/core-composer-scaffold is one) carry a null licence
              # on their stable releases in Packagist's mirror and only set
              # it on the newest entry, dev or not.
              packagist_licence=$(printf '%s' "$json" \
                | jq -r --arg name "$name" '(.packages[$name][0].license // []) | join(", ")')
              if [ "$packagist_licence" != "$recorded" ]; then
                licence_problem=1
                licence_table="${licence_table}| ${name} | ${recorded} | ${packagist_licence:-(none)} |\n"
              fi
            else
              licence_problem=1
              licence_table="${licence_table}| ${name} | (no NOTICE.md row) | — |\n"
            fi
          done < <(devbox run -- ./target/release/viv diagnose --adapters)

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")

          if [ "$behind" = "1" ]; then
            {
              echo "One or more native adapters (\`src/plugins/*.rs\`) have fallen behind the Composer plugin they port. A lagging adapter isn't wrong on its own — its fixture still proves the output it emits (see \`docs/plugin-strategy.md#upstream-drift\`) — but it's worth re-checking against the fixture named below."
              echo
              printf '%b' "$table"
              echo
              echo "Run: $run_url"
            } > drift-report.md
            if [ -n "$issue_number" ]; then
              gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file drift-report.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file drift-report.md
            fi
          elif [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --comment "No native adapter is behind upstream as of this run: $run_url"
          fi

          # A licence mismatch is not a lag to track — it's either NOTICE.md
          # going stale against a relicense, or a GPL (or otherwise
          # incompatible) port that shipped without a NOTICE.md row. Both
          # need a human before the next release, so this fails the run
          # instead of filing an issue like the version check above.
          if [ "$licence_problem" = "1" ]; then
            echo "::error::One or more ported plugins' licences don't match NOTICE.md — see the job log."
            printf '%b' "$licence_table"
            exit 1
          fi
