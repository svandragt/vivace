name: Compatibility sweep

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      seed:
        description: "Random sample seed (default: today's date)"
        required: false
      random:
        description: "Random sample size"
        required: false
        default: "10"

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
      - run: make compat
        env:
          COMPAT_SEED: ${{ github.event_name == 'schedule' && github.run_id || inputs.seed }}
          COMPAT_RANDOM: ${{ inputs.random }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compat-report
          retention-days: 90
          path: |
            compat/results/*.md
            compat/results/*-logs/
      - if: always() && github.event_name == 'schedule' && failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().slice(0, 10);
            const title = `Compat sweep drift: ${date}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const report = fs.readdirSync('compat/results').find(f => f.endsWith('.md'));
            const reportBody = report
              ? fs.readFileSync(`compat/results/${report}`, 'utf8').split('\n').slice(0, 40).join('\n')
              : '(no report found)';
            const body = `Scheduled compat sweep failed: ${runUrl}\n\n\`\`\`\n${reportBody}\n\`\`\``;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'compat',
            });
            const existing = issues.find(i => i.title.startsWith('Compat sweep drift'));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['compat'],
                body,
              });
            }
