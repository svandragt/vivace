name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (for a manual rerun)"
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: rustup target add ${{ matrix.target }}
      # musl targets have no Docker daemon on GitHub runners for `cross`, so
      # link with zig via cargo-zigbuild instead; macOS cross (arm64 runner
      # building x86_64, or vice versa) needs only the target added above.
      - name: Install cargo-zigbuild
        if: matrix.musl
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
      - name: Build
        run: |
          if [ "${{ matrix.musl }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          name="vivace-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/viv target/${{ matrix.target }}/release/composer LICENSE README.md "$name"/
          tar czf "${name}.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: vivace-*.tar.gz
      # Debian packaging only makes sense for the musl (Linux) targets.
      - name: Install cargo-deb
        if: matrix.musl
        run: cargo install cargo-deb --version 3.8.0 --locked
      # --no-strip: cargo-deb strips with the host's strip, which cannot read
      # the aarch64 binary on an x86_64 runner; the tarballs ship unstripped
      # too, so the .deb matches them.
      - name: Build .deb package
        if: matrix.musl
        run: cargo deb --no-build --no-strip --target ${{ matrix.target }} -o dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.musl
        with:
          name: dist-deb-${{ matrix.target }}
          path: dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum vivace-*.tar.gz *.deb > SHA256SUMS
          version=$(echo "$TAG" | sed 's/^v//')
          ../scripts/brew-formula.sh "$version" SHA256SUMS > vivace.rb
          # Formula is ready to copy into the svandragt/homebrew-tap repository;
          # creating and maintaining that tap is out of scope for this workflow.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Match the milestone whose title starts with the tag's major.minor,
            # e.g. v0.6.0 -> "0.6 ...". Falls back to auto-generated notes if
            # no such milestone exists.
            minor=$(echo "$TAG" | sed -E 's/^v?([0-9]+\.[0-9]+).*/\1/')
            milestone=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=all" \
              --jq "[.[] | select(.title | startswith(\"$minor\"))][0].title")
            if [ -n "$milestone" ]; then
              ../scripts/changelog.sh "$milestone" "$version" >notes.md
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --notes-file notes.md
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes
            fi
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber vivace-*.tar.gz *.deb SHA256SUMS vivace.rb
