name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (for a manual rerun)"
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            deb: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
            deb: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: rustup target add ${{ matrix.target }}
      # musl targets have no Docker daemon on GitHub runners for `cross`, so
      # link with zig via cargo-zigbuild instead; macOS cross (arm64 runner
      # building x86_64, or vice versa) needs only the target added above.
      - name: Install cargo-zigbuild
        if: matrix.musl
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
      - name: Build
        run: |
          if [ "${{ matrix.musl }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          name="vivace-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/viv target/${{ matrix.target }}/release/composer LICENSE README.md "$name"/
          tar czf "${name}.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: vivace-*.tar.gz
      # Debian packaging: gnu x86_64 for glibc hosts (faster binary), musl
      # aarch64 since there is no gnu aarch64 build.
      - name: Install cargo-deb
        if: matrix.deb
        run: cargo install cargo-deb --version 3.8.0 --locked
      # --no-strip: cargo-deb strips with the host's strip, which cannot read
      # the aarch64 binary on an x86_64 runner; the tarballs ship unstripped
      # too, so the .deb matches them.
      - name: Build .deb package
        if: matrix.deb
        run: cargo deb --no-build --no-strip --target ${{ matrix.target }} -o dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.deb
        with:
          name: dist-deb-${{ matrix.target }}
          path: dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Checkout first: it cleans the workspace, so artifacts downloaded
      # before it are gone by the publish step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum vivace-*.tar.gz *.deb > SHA256SUMS
          version=$(echo "$TAG" | sed 's/^v//')
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Match the milestone whose title starts with the tag's major.minor,
            # e.g. v0.6.0 -> "0.6 ...". Falls back to auto-generated notes if
            # no such milestone exists.
            minor=$(echo "$TAG" | sed -E 's/^v?([0-9]+\.[0-9]+).*/\1/')
            milestone=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=all" \
              --jq "[.[] | select(.title | startswith(\"$minor\"))][0].title")
            if [ -n "$milestone" ]; then
              ../scripts/changelog.sh "$milestone" "$version" >notes.md
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
            fi
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber vivace-*.tar.gz *.deb SHA256SUMS

  # #166: `cargo binstall vivace` reads the crate's own
  # `[package.metadata.binstall]` off crates.io to find the release tarball,
  # so the crate has to be there for the command the README documents to
  # work at all. Runs after `release`, because binstall resolves a version to
  # a tarball that must already be uploaded.
  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job level, not step level: a step's own `env` is not visible to that
    # step's `if`, and a secret cannot be read from an `if` directly.
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: publish
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # crates.io is gated on 1.0 (#166), and a publish cannot be undone —
      # only yanked — so a 0.x tag must not reach it even once the token
      # exists. The version gate is checked here rather than in the job's
      # `if:` so the summary can say which condition stopped it.
      - id: gate
        run: |
          case "$TAG" in
            v0.*|0.*) echo "one_zero=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "one_zero=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - if: steps.gate.outputs.one_zero == 'true' && env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish
      - if: steps.gate.outputs.one_zero != 'true'
        run: |
          echo "crates.io publish skipped: $TAG is pre-1.0, see #166." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.one_zero == 'true' && env.CARGO_REGISTRY_TOKEN == ''
        run: |
          echo 'crates.io publish skipped: no CARGO_REGISTRY_TOKEN secret set.' >> "$GITHUB_STEP_SUMMARY"

  # #213: the image a multi-stage Dockerfile's vendor stage uses instead of
  # `composer:2`. Packaging on the musl tarballs `build` already uploaded,
  # not a second compile. Runs after `release` so the tag it names is the
  # one whose assets exist.
  image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      # `Dockerfile` expects `dist/<TARGETARCH>/`, so map Rust's target
      # triples onto Docker's architecture names once, here.
      - name: Lay out the binaries by Docker architecture
        run: |
          set -euo pipefail
          for pair in "amd64:x86_64-unknown-linux-musl" "arm64:aarch64-unknown-linux-musl"; do
            arch="${pair%%:*}"
            target="${pair#*:}"
            tarball="artifacts/vivace-${TAG}-${target}.tar.gz"
            [ -f "$tarball" ] || { echo "::error ::missing $tarball"; exit 1; }
            mkdir -p "dist/${arch}"
            tar xzf "$tarball" -C "dist/${arch}" --strip-components=1
            # Fail loudly here rather than shipping an image whose binary is
            # missing: COPY of an absent path is an error, but a truncated
            # or wrong-arch one is not.
            file "dist/${arch}/viv" | tee /dev/stderr | grep -q 'statically linked'
          done
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Moving tags, narrowest first: the exact version, then the minor
      # series, then the major. No `:latest` — #212 is the cautionary tale
      # for a tag a scripted consumer trusts, and a 0.x major tag is already
      # as loose as this should get before 1.0.
      - id: tags
        run: |
          set -euo pipefail
          version="${TAG#v}"
          minor="${version%.*}"
          major="${version%%.*}"
          {
            echo "list<<EOF"
            echo "${IMAGE}:${version}"
            echo "${IMAGE}:${minor}"
            echo "${IMAGE}:${major}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          provenance: false
      # Every tag this job just wrote must actually resolve, on both
      # architectures. #212 shipped ten releases whose `releases/latest`
      # 404'd because nothing ever asked for the thing it had published.
      - name: Verify every published tag pulls and runs
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for tag in "${version}" "${version%.*}" "${version%%.*}"; do
            for platform in linux/amd64 linux/arm64; do
              got=$(docker run --rm --platform "$platform" "${IMAGE}:${tag}" --version)
              echo "${IMAGE}:${tag} ($platform) -> ${got}"
              case "$got" in
                *"${version}"*) ;;
                *) echo "::error ::${IMAGE}:${tag} ($platform) reports '${got}', expected ${version}"; exit 1 ;;
              esac
              # The shim ships alongside viv and is the migration path
              # (#211); an image without it on PATH silently drops half the
              # point of publishing one. Its `--version` prints, then execs
              # the real Composer for anything it does not handle — which
              # this image deliberately does not carry, so it exits 1. Match
              # the line it prints rather than the exit code.
              shim=$(docker run --rm --platform "$platform" \
                --entrypoint /usr/local/bin/composer "${IMAGE}:${tag}" --version 2>&1 || true)
              case "$shim" in
                *"composer shim"*) ;;
                *) echo "::error ::composer shim missing or wrong in ${IMAGE}:${tag} ($platform): ${shim}"; exit 1 ;;
              esac
            done
          done
